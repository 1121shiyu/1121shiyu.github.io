name: Get Citation Data


on:

  page_build:

  schedule:
    - cron: '0 8 * * *'



# 允许 GitHub Actions 写入仓库
permissions:

  contents: write



jobs:


  build:


    runs-on: ubuntu-latest



    steps:


      # 拉取仓库代码
      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          token: ${{ secrets.GITHUB_TOKEN }}




      # 使用 Python 3.9
      # scholarly==1.5.1 对 Python 3.9 更稳定

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.9'




      # 安装依赖

      - name: Install requirements

        run: |


          cd ./google_scholar_crawler


          python -m pip install --upgrade pip


          python -m pip install -r requirements.txt





      # 执行 Google Scholar crawler

      - name: Run Google Scholar crawler


        env:

          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}


        run: |


          cd ./google_scholar_crawler


          python -u main.py






      # 推送生成的数据到 google-scholar-stats 分支

      - name: Update citation data


        run: |


          cd ./google_scholar_crawler/results



          git init



          git config --local user.name "${GITHUB_ACTOR}"


          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"




          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"




          git add *.json




          git commit -m "Updated Citation Data"




          git push "${remote_repo}" HEAD:google-scholar-stats --force
