# Welcome to Jekyll!
# Personal Homepage Configuration Template
# Please replace all fields marked with 【】

# ============================================================
# Site Settings
# ============================================================

# 网站标题
# 浏览器标签页显示
title                    : "【必须填写：姓名 / 个人主页标题】"


# 网站简介
# 用于SEO和搜索引擎描述
description              : "【必须填写：一句话个人介绍，例如研究方向、职位、机构】"


# GitHub仓库地址
# 如果部署到自己的仓库，需要修改
repository               : "【必须填写：GitHub用户名/仓库名】"


# Google Scholar统计功能
# 学术主页建议保留
google_scholar_stats_use_cdn : true



# ============================================================
# Google Analytics
# ============================================================

# 网站访问统计
# 没有Google Analytics账号可以留空
google_analytics_id      : 【可选：Google Analytics ID】



# ============================================================
# SEO Verification
# ============================================================

# 搜索引擎验证
# 如果希望Google/Bing/百度收录，可填写

google_site_verification : 【可选：Google Search Console验证码】

bing_site_verification   : 【可选：Bing Webmaster验证码】

baidu_site_verification  : 【可选：百度站长验证码】



# ============================================================
# Site Author
# 个人信息区域（重点修改）
# ============================================================

author:

  # 姓名
  name             : "【必须填写：姓名】"


  # 头像路径
  # 图片放置位置：
  # images/xxx.png
  avatar           : "images/【必须填写：头像文件名】"


  # 简短介绍
  # 会显示在侧边栏
  bio              : "【必须填写：身份/职位/研究方向】"


  # 所在地区
  location         : "【必须填写：城市, 国家】"


  # 工作/学校单位
  employer         : "【建议填写：学校/研究机构/公司】"



  # ========================================================
  # Academic Profiles
  # ========================================================


  # PubMed主页
  pubmed           : 【可选：PubMed主页链接】


  # Google Scholar
  # 如果是学术主页强烈建议填写
  googlescholar    : "【建议填写：Google Scholar主页链接】"



  # Email
  email            : "【必须填写：公开邮箱】"



  # ResearchGate
  researchgate     : "【可选：ResearchGate主页】"



  # 个人主页网址
  uri              : "【可选：个人网站地址】"



  # ========================================================
  # Developer / Social Links
  # 根据实际情况填写
  # 不使用保持为空
  # ========================================================


  github           : "【可选：GitHub用户名】"


  linkedin         : "【可选：LinkedIn用户名】"


  orcid            : "【可选：ORCID编号】"


  dblp             : "【可选：DBLP主页】"



  # 以下社交账号一般学术主页不用
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  google_plus      :
  keybase          :
  instagram        :
  impactstory      :
  lastfm           :
  pinterest        :
  soundcloud       :
  stackoverflow    :
  steam            :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :



# ============================================================
# Reading Files
# ============================================================

# 不需要修改
include:
  - .htaccess
  - _pages
  - files


# 不需要修改
exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor



# ============================================================
# Encoding / Markdown
# ============================================================

# 保持默认
keep_files:
  - .git
  - .svn

encoding: "utf-8"

markdown_ext: "markdown,mkdown,mkdn,mkd,md"



# ============================================================
# Conversion
# ============================================================

# 保持默认
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# ============================================================
# Markdown Processing
# ============================================================

# 保持默认
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false



# ============================================================
# Page Defaults
# ============================================================

# 所有页面默认使用default布局
# 保持默认

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true



# ============================================================
# Sass
# ============================================================

# CSS配置
# 保持默认

sass:
  sass_dir: _sass
  style: compressed



# ============================================================
# Output
# ============================================================

# URL格式
# 保持默认

permalink: /:categories/:title/


# 时区
# 根据所在地区调整
timezone: Asia/Shanghai



# ============================================================
# Plugins
# ============================================================

# 保持默认

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from



# ============================================================
# HTML Compression
# ============================================================

# 页面压缩
# 保持默认

compress_html:
  clippings: all
  ignore:
    envs: development
