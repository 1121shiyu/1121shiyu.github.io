# Welcome to Jekyll!
# Personal Homepage Configuration
# ============================================================
# Site Settings
# ============================================================

title                    : "Shengrong Li"

description              : "Personal homepage of Shengrong Li"

repository               : "1121shiyu/1121shiyu.github.io"

# GitHub Project Pages 必需
baseurl                  : ""

# Google Scholar citation statistics
google_scholar_stats_use_cdn : true



# ============================================================
# Google Analytics
# ============================================================

# Optional
google_analytics_id      :



# ============================================================
# SEO Verification
# ============================================================

google_site_verification :
bing_site_verification   :
baidu_site_verification  :



# ============================================================
# Site Author
# ============================================================

author:

  name             : "Shengrong Li"


  # Avatar image path
  # Example:
  # images/avatar.png
  avatar           : "images/android-chrome-512x512.png"


  # Short introduction shown in sidebar
  bio              :


  # Example:
  # Beijing, China
  location         :


  # University / Institute / Company
  employer         :



  # ========================================================
  # Academic Profiles
  # ========================================================

  pubmed           :


  # Google Scholar profile URL
  # Example:
  # https://scholar.google.com/citations?user=XXXX

  googlescholar    :



  email            :


  researchgate     :


  uri              :



  # ========================================================
  # Social Links
  # ========================================================

  github           :

  linkedin         :

  orcid            :

  dblp             :



  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  google_plus      :
  keybase          :
  instagram        :
  impactstory      :
  lastfm           :
  pinterest        :
  soundcloud       :
  stackoverflow    :
  steam            :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :



# ============================================================
# Reading Files
# ============================================================

include:
  - .htaccess
  - _pages
  - files


exclude:
  - docs
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor



# ============================================================
# Encoding / Markdown
# ============================================================

keep_files:
  - .git
  - .svn


encoding: "utf-8"

markdown_ext: "markdown,mkdown,mkdn,mkd,md"



# ============================================================
# Conversion
# ============================================================

markdown: kramdown

highlighter: rouge

lsi: false

excerpt_separator: "\n\n"

incremental: false



# ============================================================
# Markdown Processing
# ============================================================

kramdown:

  input: GFM

  hard_wrap: false

  auto_ids: true

  footnote_nr: 1

  entity_output: as_char

  toc_levels: 1..6

  smart_quotes: lsquo,rsquo,ldquo,rdquo

  enable_coderay: false



# ============================================================
# Defaults
# ============================================================

defaults:

  - scope:

      path: ""

      type: pages

    values:

      layout: default

      author_profile: true



# ============================================================
# Sass
# ============================================================

sass:

  sass_dir: _sass

  style: compressed



# ============================================================
# Output
# ============================================================

permalink: /:categories/:title/


timezone: Asia/Shanghai



# ============================================================
# Plugins
# ============================================================

plugins:

  - jekyll-paginate

  - jekyll-sitemap

  - jekyll-gist

  - jekyll-feed

  - jekyll-redirect-from



# ============================================================
# HTML Compression
# ============================================================

compress_html:

  clippings: all

  ignore:

    envs: development
